name: sqltom-integration

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sqltom_test_2026!"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sqltom_test
      POSTGRES_USER: sqltom
      POSTGRES_PASSWORD: sqltom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqltom -d sqltom_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sqltom_test
      MYSQL_USER: sqltom
      MYSQL_PASSWORD: sqltom
      MYSQL_ROOT_PASSWORD: sqltom-root
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SQLTOM_REQUIRE_EXTERNAL_DATABASES: "1"
      SQLTOM_SQLSERVER_ADMIN_DSN: "sqlserver://sa:Sqltom_test_2026!@sqlserver:1433?database=master&encrypt=disable"
      SQLTOM_SQLSERVER_DSN: "sqlserver://sa:Sqltom_test_2026!@sqlserver:1433?database=sqltom_test&encrypt=disable"
      SQLTOM_POSTGRES_DSN: "postgres://sqltom:sqltom@postgres:5432/sqltom_test?sslmode=disable"
      SQLTOM_MYSQL_DSN: "sqltom:sqltom@tcp(mysql:3306)/sqltom_test?parseTime=true"
